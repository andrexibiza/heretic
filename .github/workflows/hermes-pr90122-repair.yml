name: Repair Hermes PR 90122

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/hermes-pr90122-repair.yml
      - .github/scripts/repair_pr90122.py

permissions:
  contents: read

jobs:
  repair:
    name: Apply, test, and publish the reviewed repair
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_REPO: smfworks/hermes-agent
      SOURCE_BRANCH: fix/cron-windows-worker-death-90089
      SOURCE_SHA: 2b119d2869e7c413cc512cf434f32ecebf076a46
      SOURCE_PR_REPO: NousResearch/hermes-agent
      SOURCE_PR_NUMBER: "90122"
      FALLBACK_REPO: andrexibiza/hermes-agent
      FALLBACK_BRANCH: fix/pr-90122-review-blockers
      FALLBACK_EXPECTED_SHA: 7f7a1fdfe0ef402d40ca970b24fd5f5f5c85f16f
      GH_TOKEN: ${{ secrets.ARES_REVIEW_TOKEN }}

    steps:
      - name: Check out the publication helper
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Require the publication token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || {
            echo "ARES_REVIEW_TOKEN is unavailable; refusing to create an unpublishable repair."
            exit 1
          }

      - name: Check out the exact reviewed contributor head
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --single-branch \
            --branch "$SOURCE_BRANCH" \
            "https://github.com/${SOURCE_REPO}.git" work
          cd work
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$SOURCE_SHA" ]]; then
            echo "Contributor branch moved: expected $SOURCE_SHA, found $actual"
            exit 1
          fi

      - name: Apply both review-blocker repairs
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/repair_pr90122.py work
          cd work
          git diff --check
          python -m py_compile \
            cron/executions.py \
            cron/scheduler.py \
            tests/cron/test_model_pin_fallback_90089.py \
            tests/cron/test_silent_worker_death_90089.py

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            work/pyproject.toml
            work/uv.lock

      - name: Run focused cron regressions
        shell: bash
        run: |
          set -euo pipefail
          cd work
          uv python install 3.11
          uv sync --locked --python 3.11 --extra all --extra dev
          source .venv/bin/activate
          python -m pytest -q \
            tests/cron/test_model_pin_fallback_90089.py \
            tests/cron/test_silent_worker_death_90089.py \
            tests/cron/test_execution_ledger.py

      - name: Commit and publish the repair
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          cd work
          git config user.name "Axl Ibiza"
          git config user.email "andrexibiza@users.noreply.github.com"
          git add \
            cron/executions.py \
            cron/scheduler.py \
            tests/cron/test_model_pin_fallback_90089.py \
            tests/cron/test_silent_worker_death_90089.py
          git commit -m "fix(cron): keep fallback routing atomic and preserve unknown outcomes (#90089)"
          new_sha="$(git rev-parse HEAD)"

          direct_remote="https://x-access-token:${GH_TOKEN}@github.com/${SOURCE_REPO}.git"
          set +e
          git push "$direct_remote" "HEAD:refs/heads/${SOURCE_BRANCH}"
          direct_status=$?
          set -e

          if [[ $direct_status -eq 0 ]]; then
            mode="original"
            published_url="https://github.com/${SOURCE_REPO}/commit/${new_sha}"
            pr_url="https://github.com/${SOURCE_PR_REPO}/pull/${SOURCE_PR_NUMBER}"
          else
            fallback_remote="https://x-access-token:${GH_TOKEN}@github.com/${FALLBACK_REPO}.git"
            git push \
              --force-with-lease="refs/heads/${FALLBACK_BRANCH}:${FALLBACK_EXPECTED_SHA}" \
              "$fallback_remote" "HEAD:refs/heads/${FALLBACK_BRANCH}"
            mode="replacement"
            published_url="https://github.com/${FALLBACK_REPO}/commit/${new_sha}"

            existing="$(gh api \
              "repos/${SOURCE_PR_REPO}/pulls?state=open&head=andrexibiza:${FALLBACK_BRANCH}" \
              --jq '.[0].html_url // empty')"
            if [[ -n "$existing" ]]; then
              pr_url="$existing"
            else
              body_file="$(mktemp)"
              cat > "$body_file" <<EOF
## Summary

Supersedes #90122 after its exact reviewed head \`${SOURCE_SHA}\` was found to split provider/model fallback identity and convert uncertain execution residue into a known failure.

This branch keeps @smfworks' complete #90122 commit as its parent, then adds only the two review-blocker repairs:

- every fallback remains one configured provider/model route; all explicit pins must match, otherwise the run fails closed;
- a body that exits without durable terminal evidence settles its exact execution as immutable \`unknown\`, never fabricated \`failed\`.

## Validation

- focused model-fallback, silent-worker, and execution-ledger suites executed on GitHub;
- modified files pass \`py_compile\` and \`git diff --check\`.

Preserves #90089 / @fooler64 as the source report and #90122 / @smfworks as the original implementation and provenance.
EOF
              pr_json="$(gh api --method POST "repos/${SOURCE_PR_REPO}/pulls" \
                -f title='fix(cron): keep fallback routing atomic and preserve unknown outcomes (#90089)' \
                -f head="andrexibiza:${FALLBACK_BRANCH}" \
                -f base='main' \
                -F body="@$body_file")"
              pr_url="$(printf '%s' "$pr_json" | python -c 'import json,sys; print(json.load(sys.stdin)["html_url"])')"
              rm -f "$body_file"
            fi
          fi

          {
            echo "mode=$mode"
            echo "new_sha=$new_sha"
            echo "published_url=$published_url"
            echo "pr_url=$pr_url"
          } >> "$GITHUB_OUTPUT"

      - name: Post the source-of-truth receipt on #90122
        shell: bash
        env:
          MODE: ${{ steps.publish.outputs.mode }}
          NEW_SHA: ${{ steps.publish.outputs.new_sha }}
          PUBLISHED_URL: ${{ steps.publish.outputs.published_url }}
          PR_URL: ${{ steps.publish.outputs.pr_url }}
        run: |
          set -euo pipefail
          if [[ "$MODE" == "original" ]]; then
            disposition="Both review blockers are now implemented on this original contributor branch."
          else
            disposition="The contributor fork rejected the maintainer push, so the exact-head repair is published as a replacement PR while preserving @smfworks' commit as the parent."
          fi

          body_file="$(mktemp)"
          cat > "$body_file" <<EOF
${disposition}

Published commit: ${PUBLISHED_URL}
Review/merge surface: ${PR_URL}

Implemented:
- provider + model remain one configured fallback route; incompatible explicit pins fail closed instead of synthesizing a route;
- evidence-poor execution residue is CAS-terminalized as immutable \`unknown\`, while \`failed\` remains reserved for positive failure evidence.

GitHub-hosted validation completed before publication: modified-file \`py_compile\`, \`git diff --check\`, and focused model-fallback, silent-worker, and execution-ledger tests.

Commit: \`${NEW_SHA}\`
EOF
          gh api --method POST \
            "repos/${SOURCE_PR_REPO}/issues/${SOURCE_PR_NUMBER}/comments" \
            -F body="@$body_file"
          rm -f "$body_file"

      - name: Summarize
        shell: bash
        run: |
          {
            echo "## Hermes PR #90122 repair"
            echo
            echo "- Publication mode: ${{ steps.publish.outputs.mode }}"
            echo "- Commit: ${{ steps.publish.outputs.new_sha }}"
            echo "- Published: ${{ steps.publish.outputs.published_url }}"
            echo "- Review/merge surface: ${{ steps.publish.outputs.pr_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
